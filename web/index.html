<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164e63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Percentage Company - Accounts, Billing & Corporate Finance Suite">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TPC Accounts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Inter is bundled with Flutter assets, including offline app-shell use. -->

  <title>The Percentage Company - Accounts</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body {margin:0;background:#f7f8fa}
    #launch {position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:16px system-ui;color:#164e63;padding:24px}
    #launch img {width:80px;height:80px;margin:0 auto 20px;border-radius:20px}
    #launch .pulse {width:40px;height:4px;margin:20px auto;background:#164e63;border-radius:4px;animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse {50% {opacity:.35;transform:scaleX(.6)}}
    @media(prefers-reduced-motion:reduce) {#launch .pulse {animation:none}}
  </style>
  <div id="launch" role="status" aria-live="polite"><img src="icons/Icon-192.png" alt=""><strong>TPC Accounts</strong><p>Opening your workspace…</p><div class="pulse"></div></div>
  <script src="pwa.js" defer></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
