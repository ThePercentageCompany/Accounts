name: tpc_invoice
description: TPC invoice billing for mobile and web.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  archive: ^4.0.9
  invoice_kit: ^0.2.0
  file_picker: ^10.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  mobile_scanner: ^7.1.2
  qr: ^3.0.2
  idb_shim: ^2.9.10
  web: ^1.1.1
  http_parser: ^4.1.2
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.10.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/tpc_symbol.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
